# cargo-deny policy, checked in CI: known advisories, license allowlist, crate sources.
[graph]
all-features = true

[advisories]
# RustSec database; yanked crates fail too.
yanked = "deny"

[licenses]
# Permissive licenses only (the workspace ships as Apache-2.0 OR MIT).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are reported, not fatal: they come from upstream crates.
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies of unpublished crates are not wildcards in practice.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
