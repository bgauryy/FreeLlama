name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      FREELLAMA_MCP_AUTOSTART_SERVE: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable workspace Yarn
        run: corepack enable
      - name: Install locked JavaScript dependencies
        run: yarn install --immutable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Rust formatting and production panic/lock lint
        if: runner.os == 'Linux'
        run: yarn lint:rust
      - name: Build binary, native addon, and JavaScript
        run: yarn build
      - name: Verify generated native declarations
        run: git diff --exit-code -- packages/mcp/native/index.d.ts
      - name: TypeScript contracts
        run: yarn typecheck
      - name: Full JavaScript contracts and evaluation fixtures (POSIX)
        if: runner.os != 'Windows'
        run: yarn test:js
      - name: Portable Windows CLI, protocol and checker contracts (POSIX research excluded)
        if: runner.os == 'Windows'
        run: >-
          yarn vitest run
          packages/cli/test/launcher.test.ts
          packages/cli/test/install-powershell.test.ts
          packages/mcp/test/unit/agent-cli.test.ts
          packages/mcp/test/unit/agent-cli-auth.test.ts
          packages/mcp/test/unit/agent-cli-response-limit.test.ts
          packages/mcp/test/unit/gateway-receipts.test.ts
          packages/mcp/test/unit/job-calibration.test.ts
          packages/mcp/test/unit/job-mode.test.ts
          packages/mcp/test/unit/result-checks.test.ts
          packages/mcp/test/unit/result-text.test.ts
          packages/mcp/test/unit/tool-call-checks.test.ts
      - name: Rust contracts
        run: yarn test:rust
      - name: Observe live Windows memory telemetry
        if: runner.os == 'Windows'
        run: cargo test -p freellama-core --lib live_host_resource_observation -- --ignored --nocapture
      - name: Release packaging contracts
        if: runner.os != 'Windows'
        run: yarn test:release
