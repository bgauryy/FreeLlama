name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust ${{ matrix.os }} (fmt · clippy · test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install   # rust-toolchain.toml: pinned compiler + rustfmt/clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Several code paths are cfg-gated per OS, so clippy must run on every OS: the
      # Sep 1 failures lived in cfg(not(macos)) blocks that a macOS-only check never compiles.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace

  msrv:
    name: rust MSRV (1.88 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --locked --workspace --all-targets --all-features

  supply-chain:
    name: rust supply chain (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # deny.toml: RustSec advisories, license allowlist, crate sources.
      - uses: EmbarkStudios/cargo-deny-action@v2

  js:
    name: js ${{ matrix.os }} (native build · typecheck · unit and adapter tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Corepack must run before any yarn command: the runner's global yarn is 1.x, while
      # .yarnrc.yml pins Yarn 4. setup-node's yarn cache probe ran the 1.x binary and failed.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn npm audit --all --recursive --environment production
      - run: yarn build:native
      # index.d.ts is generated from napi.rs and committed; a diff means it is stale.
      - run: git diff --exit-code -- packages/mcp/native/index.d.ts
      - run: yarn workspace @octocodeai/freellama-mcp-server build
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:agents:node
      - run: yarn test:release
      - run: yarn release:verify

  python:
    name: python contracts (hardware · harness · policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Corepack before yarn: the runner's global yarn is 1.x. The scripts below are pure Python;
      # Yarn only needs the install state to run them, so skip package build steps.
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - name: Hardware harness contract tests
        run: yarn test:hardware
      - name: Harness policy contract tests
        run: python3 -m unittest discover -s benchmark/harness/scripts -p 'test_policy_from_eval.py'
      - name: Benchmark harness self-test (fixture needs Python >= 3.11)
        run: python benchmark/harness/scripts/self_test.py
      # Publishable runs refuse an expired suite; CI only warns so a calendar date never breaks a build.
      - name: Benchmark suite review freshness (warning only)
        continue-on-error: true
        run: python benchmark/harness/scripts/validate.py --suite benchmark/harness/tasks/suite.json || { echo "::warning title=Benchmark suite review expired::review benchmark/harness/tasks/suite.json and advance last_reviewed_at/review_due_at"; exit 1; }
