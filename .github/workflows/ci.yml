name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast follow-up push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust ${{ matrix.os }} (fmt · clippy · test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting first: cheapest signal, fails fastest.
      - name: cargo fmt
        run: cargo fmt --all --check

      # Deny warnings in CI. The workspace lints (all + pedantic) are warn-level locally so a WIP
      # build isn't blocked; CI is where they become mandatory. napi stays off (default features),
      # since its FFI symbols only link inside a Node process.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  js:
    name: js ${{ matrix.os }} (native build · typecheck · unit tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The MCP server loads a native addon compiled from packages/rust-core/src/napi.rs, so this
      # job needs a Rust toolchain too.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Yarn 4 via corepack (yarnPath is pinned in .yarnrc.yml); one install covers every workspace.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --immutable

      # Native addon into packages/mcp/native, then the server itself (esbuild).
      - name: Build native addon
        run: yarn build:native

      - name: Build MCP server
        run: yarn workspace freellama-mcp-server build

      - name: Typecheck
        run: yarn typecheck

      # Unit tier only: pure-function tests plus the tool-map drift guard, fully offline.
      # The integration/e2e tiers (yarn test:integration / test:e2e) need a live Ollama with
      # pulled models, so they run locally, not here.
      - name: Unit tests
        run: yarn test
